<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justo · Primeras 8 semanas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Justo</h1>
            <p class="tagline" id="tagline"></p>
        </header>

        <div class="language-switcher">
            <button class="lang-btn active" data-lang="es">Español</button>
            <button class="lang-btn" data-lang="en">English</button>
            <button class="lang-btn" data-lang="pt">Português</button>
        </div>

        <main>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText"></p>

            <div class="content" id="content"></div>

            <div class="actions">
                <button id="prevBtn" class="btn btn-secondary"></button>
                <button id="nextBtn" class="btn btn-primary"></button>
            </div>
        </main>

        <footer>
            <p id="footerText"></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
